{% extends "todo/base.html" %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Tags</h1>
    <a href="{% url 'todo:tag-add' %}" class="btn btn-primary">Add</a>
  </div>

  <table class="table align-middle">
    <thead><tr><th>Name</th><th>Update</th><th>Delete</th></tr></thead>
    <tbody>
    {% for tag in tags %}
      <tr>
        <td>{{ tag.name }}</td>
        <td><a href="{{ tag.get_update_url }}" class="btn btn-secondary">Update</a></td>
        <td><a href="{{ tag.get_delete_url }}" class="btn btn-secondary">Delete</a></td>
      </tr>
    {% empty %}
      <tr><td colspan="3">No tags yet.</td></tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
