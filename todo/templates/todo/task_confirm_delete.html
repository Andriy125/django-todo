{% extends "todo/base.html" %}
{% block content %}
  <h2>Delete task</h2>
  <p>Are you sure you want to delete: <b>{{ object }}</b>?</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Delete</button>
    <a href="{% url 'todo:home' %}" class="btn btn-light">Cancel</a>
  </form>
{% endblock %}
