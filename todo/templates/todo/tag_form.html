{% extends "todo/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
  <h2>{{ view.object|yesno:"Update tag,Add tag" }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="btn btn-primary">Save</button>
    <a href="{% url 'todo:tag-list' %}" class="btn btn-light">Cancel</a>
  </form>
{% endblock %}
